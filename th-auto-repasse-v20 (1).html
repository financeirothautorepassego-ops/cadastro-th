<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TH Auto Repasse | Sistema de Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
:root{
  --blue:#B8860B;--blue-light:#FDF8E7;--blue-mid:#F5E199;--blue-dark:#8B6508;
  --text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --border:#E5E7EB;--border2:#D1D5DB;
  --bg:#F9FAFB;--white:#FFFFFF;
  --green:#16A34A;--green-bg:#F0FDF4;--green-border:#BBF7D0;
  --yellow:#D97706;--yellow-bg:#FFFBEB;--yellow-border:#FDE68A;
  --red:#DC2626;--red-bg:#FEF2F2;--red-border:#FECACA;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-border:#DDD6FE;
  --orange:#EA580C;--orange-bg:#FFF7ED;--orange-border:#FED7AA;
  --teal:#0D9488;--teal-bg:#F0FDFA;--teal-border:#99F6E4;
  --gray-bg:#F3F4F6;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:224px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#sidebar.collapsed{width:0;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:56px;padding:0 24px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#global-search-wrap{position:relative;flex:1;max-width:380px;margin:0 20px}
#global-search{width:100%;padding:7px 12px 7px 34px;border:1px solid var(--border2);border-radius:99px;font-size:13px;outline:none;font-family:inherit;background:var(--bg);color:var(--text);transition:border .15s}
#global-search:focus{border-color:var(--blue);background:var(--white)}
#global-search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
#global-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--white);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:999;max-height:360px;overflow-y:auto;display:none}
#global-results.open{display:block}
.gr-section{padding:6px 0;border-bottom:1px solid var(--border)}
.gr-section:last-child{border-bottom:none}
.gr-label{padding:6px 14px 3px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.gr-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;transition:background .1s;font-size:13px}
.gr-item:hover{background:var(--blue-light);color:var(--blue)}
.gr-item .gr-icon{font-size:15px;width:20px;text-align:center}
.gr-item .gr-main{flex:1;min-width:0}
.gr-item .gr-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-item .gr-sub{font-size:11px;color:var(--text3)}
.gr-empty{padding:16px;text-align:center;color:var(--text3);font-size:13px}
/* FAB */
#fab{position:fixed;bottom:28px;right:28px;z-index:900}
#fab-main{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#D4A017,#8B6508);color:#fff;font-size:24px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;transition:transform .2s;font-family:inherit}
#fab-main:hover{transform:scale(1.08)}
#fab-menu{position:absolute;bottom:62px;right:0;display:flex;flex-direction:column;gap:10px;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(10px)}
#fab-menu.open{opacity:1;pointer-events:all;transform:translateY(0)}
.fab-item{display:flex;align-items:center;gap:10px;cursor:pointer}
.fab-item-label{background:#222;color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.fab-item-btn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .15s;font-family:inherit}
.fab-item-btn:hover{transform:scale(1.1)}
.fab-btn-venda{background:linear-gradient(135deg,#D4A017,#8B6508);color:#fff}
.fab-btn-receita{background:var(--green);color:#fff}
.fab-btn-despesa{background:var(--red);color:#fff}
.fab-btn-cp{background:var(--purple);color:#fff}
#content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.brand{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-icon{width:36px;height:36px;background:linear-gradient(135deg,#D4A017,#8B6508);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
nav{flex:1;padding:8px;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;width:100%;text-align:left;transition:all .12s;font-family:inherit;white-space:nowrap}
.nav-btn:hover{background:var(--blue-light);color:var(--blue)}
.nav-btn.active{background:var(--blue-light);color:var(--blue);font-weight:600}
.nav-user{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.avatar{width:28px;height:28px;border-radius:50%;background:#F5E199;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#8B6508;flex-shrink:0}
/* METRIC CARDS */
.cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:20px}
.mc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.mc-label{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:6px}
.mc-value{font-size:21px;font-weight:700;letter-spacing:-.5px}
.mc-sub{font-size:11px;color:var(--text3);margin-top:3px}
/* SECTION CARD */
.sc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.sc-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.sc-title{font-size:14px;font-weight:600}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFF}
.empty{padding:40px;text-align:center;color:var(--text3);font-size:13px}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.bg{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.by{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.br{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.bb{background:#FDF8E7;color:#8B6508;border:1px solid #D4A017}
.bp{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.bo{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.bt{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-border)}
.bgr{background:var(--gray-bg);color:var(--text2);border:1px solid var(--border)}
/* PIPELINE BADGES */
.pip-agu-boleto{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
.pip-boleto-pago{background:#DBEAFE;color:#1E40AF;border:1px solid #BFDBFE;font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
.pip-agu-lib{background:#EDE9FE;color:#5B21B6;border:1px solid #DDD6FE;font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
.pip-liberado{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7;font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
/* BTNS */
.btn{padding:8px 14px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .12s;font-family:inherit;line-height:1}
.btn:hover{opacity:.88}
.btn-p{background:#B8860B;color:#fff;border-color:#8B6508}
.btn-s{background:var(--white);color:var(--text);border-color:var(--border2)}
.btn-s:hover{background:var(--gray-bg)}
.btn-d{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.btn-g{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.btn-y{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border)}
.btn-sm{padding:5px 10px;font-size:12px}
.bico{padding:5px 7px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .12s;line-height:1}
.bico:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid)}
/* FILTER TABS */
.ftab{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;transition:all .12s;font-family:inherit}
.ftab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
/* SEARCH */
.sw{position:relative}
.sw input{padding-left:32px}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
/* STATUS SELECT INLINE */
.status-sel{border:1px solid var(--border);border-radius:99px;padding:3px 8px;font-size:11px;font-weight:600;cursor:pointer;outline:none;font-family:inherit;background:var(--white);transition:all .15s}
.status-pago,.status-recebido{background:var(--green-bg)!important;color:var(--green)!important;border-color:var(--green-border)!important}
.status-pendente,.status-atrasado{background:var(--yellow-bg)!important;color:var(--yellow)!important;border-color:var(--yellow-border)!important}
.status-cancelado{background:var(--gray-bg)!important;color:var(--text2)!important;border-color:var(--border)!important}
/* FORM */
input,select,textarea{background:var(--white);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{resize:vertical;min-height:70px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi{display:flex;flex-direction:column}
.fi.full{grid-column:1/-1}
.fsec{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px;grid-column:1/-1;margin-top:4px}
/* TIPO RECEITA/DESPESA TOGGLE */
.tipo-toggle{display:flex;gap:0;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden}
.tipo-btn{flex:1;padding:9px 12px;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:all .12s;background:var(--white);color:var(--text2)}
.tipo-btn.active-rec{background:var(--green-bg);color:var(--green);font-weight:700}
.tipo-btn.active-des{background:var(--red-bg);color:var(--red);font-weight:700}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.mh{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1}
.mt{font-size:15px;font-weight:700}
.mc2{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1;padding:2px 6px;border-radius:4px}
.mc2:hover{background:var(--gray-bg)}
.mb{padding:20px}
.mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--white)}
/* NOTIFY */
#notif{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--radius);font-weight:500;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:320px;box-shadow:var(--shadow-md)}
#notif.show{opacity:1}
#notif.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
#notif.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
/* LOGIN */
.ls{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.lb{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px;box-shadow:var(--shadow-md)}
.li{width:60px;height:60px;background:var(--blue);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin:0 auto 12px}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.lf input{font-size:14px;padding:11px 14px}
.lbtn{width:100%;background:var(--blue);border:none;border-radius:var(--radius-sm);padding:12px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
.lerr{background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);margin-top:12px;display:none;text-align:center}
/* CONFIRM */
.co{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:500}
.cb{background:var(--white);border-radius:var(--radius-lg);padding:28px;max-width:360px;width:90%;text-align:center;box-shadow:var(--shadow-md)}
/* DRE */
.dre-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:3px}
.dre-group{font-weight:700;background:var(--blue-light);color:var(--blue-dark);margin-top:10px}
.dre-total{font-weight:700;font-size:15px;background:var(--green-bg);color:var(--green);margin-top:6px;padding:12px 14px;border-radius:var(--radius-sm)}
.dre-neg{font-weight:700;font-size:15px;background:var(--red-bg);color:var(--red);margin-top:6px;padding:12px 14px;border-radius:var(--radius-sm)}
.dre-sub{color:var(--text2)}
/* REL TABS */
.rel-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);overflow-x:auto}
.rel-tab{padding:10px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:inherit;white-space:nowrap}
/* TOTALS BAR */
.tbar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:24px;flex-wrap:wrap}
.ti{display:flex;flex-direction:column;gap:2px}
.tl{font-size:11px;color:var(--text2);font-weight:500}
.tv{font-size:16px;font-weight:700}
/* DETAIL ROW */
.dr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.dr:last-child{border-bottom:none}
/* VENC COLORS */
.venc-ok{color:var(--green)}
.venc-hj{color:var(--yellow);font-weight:600}
.venc-atrasado{color:var(--red);font-weight:600}
/* CONFIG */
.cfg-item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--white)}
/* DOSSIÊ */
.dos-block{background:var(--blue-light);border:1px solid var(--blue-mid);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
/* SPINNER */
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
/* PRINT */
@media print{
  #sidebar,#topbar,.no-print{display:none!important}
  #main{display:block!important}
  #content{overflow:visible!important;padding:0!important}
  .sc{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid}
  body{background:#fff!important;font-size:12px}
  .btn,.bico,.ftab{display:none!important}
  .sc-header .btn,.sc-header .bico{display:none!important}
  table{font-size:11px}
  th,td{padding:7px 10px!important}
  .print-header{display:block!important}
}
.print-header{display:none;text-align:center;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #333}
@media(max-width:640px){
  #sidebar{position:fixed;height:100vh;z-index:200;transition:transform .25s ease;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #sidebar.collapsed{transform:translateX(-100%);width:224px}
  #sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199}
  #sidebar-overlay.show{display:block}
  .fg{grid-template-columns:1fr}
  .cards-row{grid-template-columns:1fr 1fr}
  #content{padding:14px}
  .tbar{gap:12px}
  table{font-size:12px}
  th,td{padding:7px 8px}
}
</style>
</head>
<body>
<div id="loginScreen" class="ls">
  <div class="lb">
    <div style="text-align:center;margin-bottom:28px">
      <div class="li">TH</div>
      <div style="font-size:20px;font-weight:700">TH AUTO REPASSE</div>
      <div style="font-size:13px;color:var(--text2);margin-top:4px">Sistema de Gestão</div>
    </div>
    <div class="lf"><label>Usuário</label><input type="text" id="loginUser" placeholder="Digite seu usuário" autocomplete="username"></div>
    <div class="lf"><label>Senha</label><input type="password" id="loginPass" placeholder="Digite sua senha" autocomplete="current-password"></div>
    <button class="lbtn" id="loginBtn">Entrar</button>
    <div class="lerr" id="loginError">Usuário ou senha incorretos</div>
  </div>
</div>
<div id="app" style="display:none">
  <div id="sidebar-overlay" onclick="fecharSidebar()"></div>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-icon">TH</div>
      <div><div style="font-size:13px;font-weight:700">TH AUTO REPASSE</div><div style="font-size:10px;color:var(--text3)">Sistema de Gestão</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="nav-user">
      <div class="avatar" id="avatarEl">--</div>
      <div>
        <div style="font-size:12px;font-weight:600" id="userLabel"></div>
        <button onclick="fazerLogout()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;padding:0;font-family:inherit">Sair</button>
      </div>
    </div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button onclick="toggleSidebar()" class="bico">☰</button>
        <span style="font-size:15px;font-weight:600" id="pageTitle">Dashboard</span>
      </div>
      <div id="global-search-wrap">
        <span id="global-search-icon">🔍</span>
        <input id="global-search" type="text" placeholder="Buscar placa, cliente, valor..." autocomplete="off" oninput="globalSearch(this.value)" onfocus="if(this.value)document.getElementById('global-results').classList.add('open')" onblur="setTimeout(function(){document.getElementById('global-results').classList.remove('open')},200)">
        <div id="global-results"></div>
      </div>
      <span style="font-size:12px;color:var(--text3)" id="todayDate"></span>
    </div>

function verificarVencimentos(){
  var amanha=new Date();amanha.setDate(amanha.getDate()+1);
  var amanhaStr=amanha.toISOString().split("T")[0];
  var hoje=today();

  // A Pagar vencendo hoje ou amanhã
  var cpAlerta=contasPagar.filter(function(x){
    return x.status==="Pendente"&&(x.vencimento===hoje||x.vencimento===amanhaStr);
  });
  // A Receber vencendo hoje ou amanhã
  var crAlerta=contasReceber.filter(function(x){
    return x.status==="Pendente"&&(x.vencimento===hoje||x.vencimento===amanhaStr);
  });

  if(!cpAlerta.length&&!crAlerta.length)return;

  var msg="⏰ LEMBRETES - TH AUTO REPASSE\n\n";
  if(cpAlerta.length){
    msg+="📤 A PAGAR:\n";
    cpAlerta.forEach(function(x){
      var quando=x.vencimento===hoje?"hoje":"amanhã";
      msg+="• "+escH(x.descricao||"-")+" — "+fmtCur(x.valor)+" ("+quando+")\n";
    });
    msg+="\n";
  }
  if(crAlerta.length){
    msg+="📥 A RECEBER:\n";
    crAlerta.forEach(function(x){
      var quando=x.vencimento===hoje?"hoje":"amanhã";
      msg+="• "+escH(x.descricao||"-")+" — "+fmtCur(x.valor)+" ("+quando+")\n";
    });
  }
  enviarTelegram(msg);
}

// Verificar vencimentos ao carregar e todo dia às 8h
function agendarLembretes(){
  verificarVencimentos();
  // Calcular ms até próximo 8h
  var agora=new Date();
  var prox=new Date();
  prox.setHours(8,0,0,0);
  if(agora>=prox)prox.setDate(prox.getDate()+1);
  var ms=prox-agora;
  setTimeout(function(){verificarVencimentos();setInterval(verificarVencimentos,86400000);},ms);
}

function verificarLeadsNovos(){

  leads.forEach(function(l){
    if(_leadsNotificados.has(l.id))return; // já notificado

function playSound(type){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(type==="venda"){
      // Fanfarra curta: dó-mi-sol
      var notes=[523,659,784];var t=ctx.currentTime;
      notes.forEach(function(freq,i){
        var oi=ctx.createOscillator(),gi=ctx.createGain();
        oi.connect(gi);gi.connect(ctx.destination);
        oi.frequency.value=freq;oi.type="sine";
        gi.gain.setValueAtTime(0,t+i*0.12);
        gi.gain.linearRampToValueAtTime(0.18,t+i*0.12+0.04);
        gi.gain.linearRampToValueAtTime(0,t+i*0.12+0.18);
        oi.start(t+i*0.12);oi.stop(t+i*0.12+0.2);
      });
    } else if(type==="lead"){
      // Som especial lead novo: acorde ascendente
      [[523,0],[659,0.1],[784,0.2],[1047,0.3]].forEach(function(n){
        var oi=ctx.createOscillator(),gi=ctx.createGain();
        oi.connect(gi);gi.connect(ctx.destination);
        oi.frequency.value=n[0];oi.type="triangle";
        gi.gain.setValueAtTime(0,ctx.currentTime+n[1]);
        gi.gain.linearRampToValueAtTime(0.18,ctx.currentTime+n[1]+0.04);
        gi.gain.linearRampToValueAtTime(0,ctx.currentTime+n[1]+0.2);
        oi.start(ctx.currentTime+n[1]);oi.stop(ctx.currentTime+n[1]+0.25);
      });
    } else if(type==="pagamento"){
      // Dois bipes positivos
      [880,1100].forEach(function(freq,i){
        var oi=ctx.createOscillator(),gi=ctx.createGain();
        oi.connect(gi);gi.connect(ctx.destination);
        oi.frequency.value=freq;oi.type="sine";
        gi.gain.setValueAtTime(0,ctx.currentTime+i*0.15);
        gi.gain.linearRampToValueAtTime(0.15,ctx.currentTime+i*0.15+0.03);
        gi.gain.linearRampToValueAtTime(0,ctx.currentTime+i*0.15+0.13);
        oi.start(ctx.currentTime+i*0.15);oi.stop(ctx.currentTime+i*0.15+0.15);
      });
    } else {
      // Bipe simples confirmação
      o.frequency.value=660;o.type="sine";
      g.gain.setValueAtTime(0,ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.12,ctx.currentTime+0.03);
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.18);
      o.start();o.stop(ctx.currentTime+0.2);
    }
  }catch(e){}
}

async function hashSenha(str){
  var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
}
function fazerLogin(){
  var user=(gv("loginUser")||"").trim().toLowerCase(),pass=gv("loginPass")||"";
  if(!USUARIOS[user]){document.getElementById("loginError").style.display="block";return;}
  hashSenha(pass).then(function(hash){
    if(USUARIOS[user]!==hash){document.getElementById("loginError").style.display="block";return;}
    document.getElementById("loginError").style.display="none";
    usuarioLogado=user;
    document.getElementById("loginScreen").style.display="none";

function initFirebase(){
  if(!firebase.apps.length)firebase.initializeApp(FB);
  db=firebase.firestore();
  col("vendas").orderBy("dataCriacao","desc").onSnapshot(function(s){vendas=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["dashboard","vendas","relatorios"]);});
  col("lancamentos").orderBy("data","desc").onSnapshot(function(s){lancamentos=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["dashboard","financeiro","relatorios"]);});
  col("contasPagar").orderBy("vencimento","asc").onSnapshot(function(s){contasPagar=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["dashboard","cxpagar","relatorios"]);});
  col("contasReceber").orderBy("vencimento","asc").onSnapshot(function(s){contasReceber=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["dashboard","cxreceber","relatorios"]);});
  col("posvenda").orderBy("dataSolicitacao","desc").onSnapshot(function(s){posvenda=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["posvenda"]);});
  col("clientes").orderBy("nome","asc").onSnapshot(function(s){clientes=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["clientes","vendas"]);});
  col("config").doc("main").onSnapshot(function(s){if(s.exists)cfg=s.data();if(currentTab==="configuracoes")render();});
  col("metas").orderBy("mes","desc").onSnapshot(function(s){metas=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});refreshView(["metas","dashboard"]);});
  db.collection("leads").orderBy("createdAt","desc").onSnapshot(function(s){
    var todos=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    // Deduplicar: se dois leads têm o mesmo WhatsApp e foram criados com menos de 2 min de diferença,
    // manter só o primeiro (mais antigo = primeiro que chegou)
    var vistos={};
    leads=todos.filter(function(l){
      var tel=(l.whatsapp||"").replace(/\D/g,"");
      if(!tel)return true; // sem telefone: não deduplica
      var t=l.createdAt?new Date(l.createdAt).getTime():0;
      if(vistos[tel]){
        var diff=Math.abs(vistos[tel]-t);
        if(diff<120000)return false; // mesmo número em menos de 2 min = duplicata
      }
      vistos[tel]=t;
      return true;
    });
    verificarLeadsNovos();
    refreshView(["leads","dashboard"]);
  },function(e){console.log("leads:",e);});
}

// ── VIA CEP ──
function buscarCEP(){
  var cep=(document.getElementById("cli_cep")||{}).value||"";
  cep=cep.replace(/\D/g,"");
  if(cep.length!==8)return;
  var btn=document.querySelector("button[onclick='buscarCEP()']");
  if(btn){btn.textContent="⏳";btn.disabled=true;}
  fetch("https://viacep.com.br/ws/"+cep+"/json/")
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.erro){notify("CEP não encontrado","err");return;}
      var cidade=document.getElementById("cli_cidade");
      var uf=document.getElementById("cli_uf");
      var bairro=document.getElementById("cli_bairro");
      var end=document.getElementById("cli_end");
      if(cidade&&!cidade.value)cidade.value=d.localidade||"";
      if(uf&&!uf.value){for(var i=0;i<uf.options.length;i++){if(uf.options[i].value===d.uf){uf.selectedIndex=i;break;}}}
      if(bairro&&!bairro.value)bairro.value=d.bairro||"";
      if(end&&!end.value)end.value=(d.logradouro||"")+(d.complemento?" "+d.complemento:"");
      notify("📍 Endereço preenchido!");
    })
    .catch(function(){notify("Erro ao buscar CEP","err");})
    .finally(function(){if(btn){btn.textContent="🔍 Buscar";btn.disabled=false;}});
}

// ── BRASIL API CNPJ ──
function buscarCNPJ(){
  var val=(document.getElementById("cli_cpf")||{}).value||"";
  var cnpj=val.replace(/\D/g,"");
  if(cnpj.length!==14)return; // só busca se for CNPJ (14 dígitos)
  var btn=document.querySelector("button[onclick='buscarCNPJ()']");
  if(btn){btn.textContent="⏳";btn.disabled=true;}
  fetch("https://brasilapi.com.br/api/cnpj/v1/"+cnpj)
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.message){notify("CNPJ não encontrado","err");return;}
      var nome=document.getElementById("cli_nome");
      var loja=document.getElementById("cli_loja");
      var cep=document.getElementById("cli_cep");
      var cidade=document.getElementById("cli_cidade");
      var uf=document.getElementById("cli_uf");
      var bairro=document.getElementById("cli_bairro");
      var end=document.getElementById("cli_end");
      if(nome&&!nome.value)nome.value=d.razao_social||"";
      if(loja&&!loja.value)loja.value=d.nome_fantasia||d.razao_social||"";
      if(cep&&!cep.value)cep.value=(d.cep||"").replace(/\D/g,"").replace(/(\d{5})(\d{3})/,"$1-$2");
      if(cidade&&!cidade.value)cidade.value=d.municipio||"";
      if(uf&&!uf.value){for(var i=0;i<uf.options.length;i++){if(uf.options[i].value===d.uf){uf.selectedIndex=i;break;}}}
      if(bairro&&!bairro.value)bairro.value=d.bairro||"";
      if(end&&!end.value)end.value=(d.logradouro||"")+(d.numero?" "+d.numero:"")+(d.complemento?" "+d.complemento:"");
      notify("🏢 Dados do CNPJ preenchidos!");
    })
    .catch(function(){notify("Erro ao buscar CNPJ","err");})
    .finally(function(){if(btn){btn.textContent="🔍 Buscar CNPJ";btn.disabled=false;}});
}

function enviarWhatsApp(id){
  var v=vendas.find(function(x){return x.id===id;});
  if(!v){notify("Venda não encontrada","err");return;}
  var tel=v.telefone||"";
  // Pegar telefone do cliente cadastrado se tiver
  if(v.clienteId){
    var c=clientes.find(function(x){return x.id===v.clienteId;});
    if(c&&c.telefone)tel=c.telefone;
  }
  // Limpar telefone - só números
  tel=tel.replace(/\D/g,"");
  if(!tel){notify("Telefone não cadastrado na venda","err");return;}
  // Garantir código do país
  if(tel.length===10||tel.length===11)tel="55"+tel;
  var link=normalizarLink(v.linkBoleto)||"(link não informado)";
  var msg="Caro "+( v.nomeComprador||"cliente")+", segue boleto referente ao veículo "+(v.modelo||"-")+" placa "+(v.placa||"-")+". Verifique os dados do boleto antes do pagamento. Lembrando que após a baixa do boleto a liberação do veículo é de 3 a 5 dias úteis. Acesse o boleto: "+link;
  var url="https://wa.me/"+tel+"?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
}

function normalizarLink(url){
  if(!url||!url.trim())return null;
  var u=url.trim();
  if(u.indexOf('http://')!==0&&u.indexOf('https://')!==0)u='https://'+u;
  return u;
}

function verificarPlacaDuplicada(placa,idAtual){
  var av=document.getElementById("v_placa_aviso");
  if(!av)return;
  var p=(placa||"").toUpperCase().trim();
  if(!p){av.style.display="none";return;}
  // Busca todas as vendas com essa placa, exceto a própria em edição
  var encontradas=vendas.filter(function(v){
    return (v.placa||"").toUpperCase().trim()===p && v.id!==idAtual;
  });
  if(!encontradas.length){av.style.display="none";return;}
  // Monta mensagem para cada ocorrência
  var msgs=encontradas.map(function(v){
    var status=v.statusVenda||"Em Andamento";
    var data=v.dataVenda?fmtDate(v.dataVenda):"data não informada";
    var comprador=v.comprador||"cliente não informado";
    var emoji=status==="Vendido"?"🔴":status==="Cancelado"?"⚠️":"🟡";
    return emoji+" <strong>"+escH(status)+"</strong> em "+data+" — Comprador: <strong>"+escH(comprador)+"</strong>";
  });
  av.innerHTML="⚠️ <strong>Atenção: esta placa já consta no sistema!</strong><br>"+msgs.join("<br>");
  av.style.display="block";
}

function salvarVenda(id){
  var placa=(gv("v_placa")||"").toUpperCase().trim(),modelo=(gv("v_modelo")||"").trim(),comprador=(gv("v_comprador")||"").trim();
  if(!placa||!modelo||!comprador){notify("Preencha Placa, Modelo e Comprador","err");return;}
  var custo=getMV("v_custo"),venda=getMV("v_venda"),margem=venda-custo;
  var data={loja:"TH AUTO REPASSE",dataVenda:gv("v_data"),placa:placa,modelo:modelo,fornecedor:gv("v_fornecedor")||null,clienteId:gv("v_clienteId")||null,emailComprador:gv("v_email")||null,linkBoleto:normalizarLink(gv("v_link_boleto")),localVeiculo:gv("v_local"),vendedor:gv("v_vendedor"),valorCusto:custo,valorVenda:venda,statusVenda:gv("v_status"),pipelineStage:gv("v_pipeline"),gerarCr:gv("v_gerarCr"),vencCr:gv("v_vencCr"),nomeComprador:comprador,nomeLoja:gv("v_loja"),uf:gv("v_uf"),telefone:gv("v_tel"),cpfCnpj:gv("v_cpf"),obs:gv("v_obs")};
  var comissaoVendedor=getMV("v_comissaoVendedor")||0;
  var comissaoVal=getMV("v_comissaoVal")||0;
  var taxaCanal=getMV("v_taxaCanal")||0;
  var canal=gv("v_canal")||null;
  var parceiro=gv("v_parceiro")||null;
  var parceiro2=gv("v_parceiro2")||null;var comissaoVal2=getMV("v_comissaoVal2")||0;
  var parceiro3=gv("v_parceiro3")||null;var comissaoVal3=getMV("v_comissaoVal3")||0;
  data.comissaoVendedor=comissaoVendedor;data.vencComVendedor=gv("v_vencComVendedor");
  data.parceiro=parceiro;data.comissaoVal=comissaoVal;data.vencCom=gv("v_vencCom");
  data.parceiro2=parceiro2;data.comissaoVal2=comissaoVal2;data.vencCom2=gv("v_vencCom2");
  data.parceiro3=parceiro3;data.comissaoVal3=comissaoVal3;data.vencCom3=gv("v_vencCom3");
  data.canal=canal;data.taxaCanal=taxaCanal;data.vencCanal=gv("v_vencCanal");
  // Pipeline Liberado → Concluída
  if(data.pipelineStage==="Liberado")data.statusVenda="Concluída";
  var promise;
  if(id){promise=col("vendas").doc(id).update(data);}
  else{data.dataCriacao=today();promise=col("vendas").add(data);}
  promise.then(function(ref){
    var vid=id||(ref?ref.id:"");
    var promises=[];
    // Gerar CR só na criação
    if(!id&&gv("v_gerarCr")==="Sim"&&margem>0){
      promises.push(col("contasReceber").add({descricao:"Intermediação — "+placa+" "+modelo,placa:placa,valor:margem,vencimento:gv("v_vencCr"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
    }
    // Comissão Vendedor: criar sempre que preenchida (criação ou edição)
    var vendedorSel=gv("v_vendedor")||null;
    if(comissaoVendedor>0&&vendedorSel){
      var cpVendExist=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="comissao"&&x.vendedor===vendedorSel;});
      if(cpVendExist.length===0){
        promises.push(col("contasPagar").add({descricao:"Comissão Vendedor — "+vendedorSel+" — "+placa,placa:placa,vendedor:vendedorSel,parceiro:vendedorSel,categoria:"comissao",valor:comissaoVendedor,vencimento:gv("v_vencComVendedor"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
      } else if(id){
        promises.push(col("contasPagar").doc(cpVendExist[0].id).update({valor:comissaoVendedor,vencimento:gv("v_vencComVendedor"),vendedor:vendedorSel,parceiro:vendedorSel}));
      }
    }
    // Comissão Parceiros: criar sempre que preenchida (criação ou edição)
    if(comissaoVal>0&&parceiro){
      // Verificar se já existe CP de comissão para essa venda
      var cpExist=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="comissao"&&x.parceiro===parceiro;});
      if(cpExist.length===0){
        promises.push(col("contasPagar").add({descricao:"Comissão — "+parceiro+" — "+placa,placa:placa,parceiro:parceiro,categoria:"comissao",valor:comissaoVal,vencimento:gv("v_vencCom"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
      } else if(id){
        // Atualizar valor se mudou
        promises.push(col("contasPagar").doc(cpExist[0].id).update({valor:comissaoVal,vencimento:gv("v_vencCom"),parceiro:parceiro}));
      }
    }
    // Parceiro 2
    if(comissaoVal2>0&&parceiro2){
      var cpEx2=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="comissao"&&x.parceiro===parceiro2;});
      if(cpEx2.length===0){
        promises.push(col("contasPagar").add({descricao:"Comissão — "+parceiro2+" — "+placa,placa:placa,parceiro:parceiro2,categoria:"comissao",valor:comissaoVal2,vencimento:gv("v_vencCom2"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
      } else if(id){
        promises.push(col("contasPagar").doc(cpEx2[0].id).update({valor:comissaoVal2,vencimento:gv("v_vencCom2"),parceiro:parceiro2}));
      }
    }
    // Parceiro 3
    if(comissaoVal3>0&&parceiro3){
      var cpEx3=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="comissao"&&x.parceiro===parceiro3;});
      if(cpEx3.length===0){
        promises.push(col("contasPagar").add({descricao:"Comissão — "+parceiro3+" — "+placa,placa:placa,parceiro:parceiro3,categoria:"comissao",valor:comissaoVal3,vencimento:gv("v_vencCom3"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
      } else if(id){
        promises.push(col("contasPagar").doc(cpEx3[0].id).update({valor:comissaoVal3,vencimento:gv("v_vencCom3"),parceiro:parceiro3}));
      }
    }
    // Taxa Canal: criar sempre que preenchida (criação ou edição)
    if(taxaCanal>0&&canal){
      var cpCanalExist=contasPagar.filter(function(x){return x.vendaId===vid&&x.categoria==="taxa_canal";});
      if(cpCanalExist.length===0){
        promises.push(col("contasPagar").add({descricao:"Taxa Canal — "+canal+" — "+placa,placa:placa,categoria:"taxa_canal",canal:canal,valor:taxaCanal,vencimento:gv("v_vencCanal"),status:"Pendente",vendaId:vid,dataCriacao:today()}));
      } else if(id){
        promises.push(col("contasPagar").doc(cpCanalExist[0].id).update({valor:taxaCanal,vencimento:gv("v_vencCanal"),canal:canal}));
      }
    }
    Promise.all(promises).then(function(){if(!id)playSound("venda");notify(id?"Atualizado!":"Venda cadastrada!");closeModal();}).catch(function(e){notify("Erro ao gerar contas: "+e.message,"err");});
  }).catch(function(e){notify("Erro: "+e.message,"err");});
}

function cancelarVenda(id){
  var v=vendas.find(function(x){return x.id===id;});
  if(!v){notify("Venda não encontrada","err");return;}
  if(v.statusVenda==="Cancelada"){notify("Venda já está cancelada","err");return;}
  confirmDlg("Cancelar Negociação","Isso cancelará a venda e todos os Contas a Receber e Contas a Pagar vinculados. Deseja continuar?",function(){
    var promises=[];
    promises.push(col("vendas").doc(id).update({statusVenda:"Cancelada",dataCancelamento:today()}));
    var cpVinc=contasPagar.filter(function(x){return x.vendaId===id&&x.status!=="Cancelado";});
    cpVinc.forEach(function(x){promises.push(col("contasPagar").doc(x.id).update({status:"Cancelado"}));});
    var crVinc=contasReceber.filter(function(x){return x.vendaId===id&&x.status!=="Cancelado";});
    crVinc.forEach(function(x){promises.push(col("contasReceber").doc(x.id).update({status:"Cancelado"}));});
    Promise.all(promises).then(function(){
      notify("Venda cancelada! "+cpVinc.length+" CP e "+crVinc.length+" CR cancelados.");
    }).catch(function(e){notify("Erro: "+e.message,"err");});
  });
}

  }).reduce(function(a,x){return a+Number(x.valor||0);},0);

  var totalComissoes=comissoes+cpComissoes;

  });
  contasPagar.filter(function(x){

    return(x.dataPagamento||x.vencimento||"").slice(0,7)===dreMes;

    "• Comissões pagas: R$ "+totalComissoes.toFixed(2)+"\n"+

    "• LUCRO LÍQUIDO: R$ "+lucro.toFixed(2)+"\n"+

  fetch("https://api.anthropic.com/v1/messages",{

    headers:{

  .then(function(r){return r.json();})

  });
}

function relDRE(){
  var meses=getAllMeses();
  var h='<div class="sc"><div class="sc-header" style="background:var(--yellow-bg)"><span class="sc-title" style="color:var(--yellow)">📋 DRE — Demonstrativo de Resultados</span><div class="export-btns no-print"><button class="btn btn-sm" onclick="analisarDRE()" style="background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;border:none">🤖 Analisar com IA</button><button class="btn btn-s btn-sm" data-action="exportar-dre-xls">📊 Excel</button><button class="btn btn-s btn-sm" data-action="exportar-dre">⬇ CSV</button><button class="btn btn-s btn-sm" onclick="imprimirDRE()">🖨 PDF</button></div></div>';
  h+='<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  h+='<select onchange="dreMes=this.value;dreIni=\'\';dreFim=\'\';render()" style="width:auto;min-width:130px"><option value="">Período livre</option>';
  meses.forEach(function(m){h+='<option value="'+m+'"'+(dreMes===m?' selected':'')+'>'+fmtMes(m)+'</option>';});
  h+='</select>';
  if(!dreMes){
    h+='<input type="date" value="'+dreIni+'" onchange="dreIni=this.value;render()" style="width:auto;min-width:130px">';
    h+='<span style="color:var(--text2);font-size:13px">até</span>';
    h+='<input type="date" value="'+dreFim+'" onchange="dreFim=this.value;render()" style="width:auto;min-width:130px">';
  }
  h+='</div>';
  function filtrarData(d){
    if(!d)return !dreMes&&!dreIni&&!dreFim;
    if(dreMes)return d.slice(0,7)===dreMes;
    if(dreIni&&d<dreIni)return false;
    if(dreFim&&d>dreFim)return false;
    return true;
  }
  // ── DRE: receita = A Receber recebido, despesas = Financeiro + A Pagar ──
  var lFilt=lancamentos.filter(function(l){return filtrarData(l.data||"");});

  // Receita = Contas a Receber com status Recebido no período
  var receita=contasReceber.filter(function(x){
    return x.status==="Recebido"&&filtrarData(x.dataRecebimento||x.vencimento||"");
  }).reduce(function(a,x){return a+Number(x.valor||0);},0);

  // Vendas no período (para info)
  var etapasDRE=["Boleto Pago","Aguardando Liberação","Liberado"];
  var vendasDRE=vendas.filter(function(v){
    return etapasDRE.indexOf(v.pipelineStage||"")>=0&&
           v.statusVenda!=="Cancelada"&&
           filtrarData(v.dataVenda||v.dataCriacao||"");
  });

  // Pendentes A Receber
  var pending=contasReceber.filter(function(x){
    return x.status==="Pendente"&&filtrarData(x.vencimento||"");
  });
  var aReceber=pending.reduce(function(a,x){return a+Number(x.valor||0);},0);

  // Comissões = Financeiro + A Pagar pagos
  var comissoesItens=[];
  lFilt.filter(function(l){return l.tipo==="despesa"&&l.categoria==="comissao";}).forEach(function(l){
    comissoesItens.push({desc:l.descricao||"Comissão",valor:Number(l.valor||0),placa:l.placa||"",parceiro:l.parceiro||""});
  });
  contasPagar.filter(function(x){
    return x.status==="Pago"&&x.categoria==="comissao"&&filtrarData(x.dataPagamento||x.vencimento||"");
  }).forEach(function(x){
    comissoesItens.push({desc:x.descricao||"Comissão",valor:Number(x.valor||0),placa:x.placa||"",parceiro:x.parceiro||""});
  });
  var comissoes=comissoesItens.reduce(function(a,x){return a+x.valor;},0);

  // Despesas por categoria (exceto comissão — já tratada separado)
  var despCats={};
  // Lançamentos financeiros (inclui retirada do sócio)
  lFilt.filter(function(l){
    if(l.tipo!=="despesa")return false;
    if((l.categoria||"")!=="comissao")return true;
    return false;
  }).forEach(function(l){
    var cat=l.categoria==="despesa_operacional"?"outros":l.categoria||"outros";
    var label=catLabel(cat)||"Outros";
    if(!despCats[label])despCats[label]=[];
    despCats[label].push({desc:l.descricao||label,valor:Number(l.valor||0),placa:l.placa||""});
  });
  // Contas a pagar pagas no período (exceto comissão — já somada acima)
  contasPagar.filter(function(x){
    return x.status==="Pago"&&(x.categoria||"")!=="comissao"&&filtrarData(x.dataPagamento||x.vencimento||"");
  }).forEach(function(x){
    var label=catLabel(x.categoria||"outros")||"Outros";
    if(!despCats[label])despCats[label]=[];
    despCats[label].push({desc:x.descricao||label,valor:Number(x.valor||0),placa:x.placa||""});
  });
  var despFin=Object.values(despCats).reduce(function(a,arr){return a+arr.reduce(function(b,x){return b+x.valor;},0);},0);

  var lucLiq=receita-comissoes-despFin;
  var margem=receita>0?((lucLiq/receita)*100).toFixed(1):0;

  // Fluxo de caixa período — usa mesma base do DRE para consistência
  var cxEnt=receita;
  // Total saídas = comissões + demais despesas (mesmo cálculo do DRE, evita dupla contagem)
  var cxSai=comissoes+despFin;
  var saldoPeriodo=cxEnt-cxSai;

  var cdbInicial=lancamentos.filter(function(l){return l.categoria==="saldo_cdb";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var cdbApl=lancamentos.filter(function(l){return(l.categoria==="aplicacao_cdb_desp"||l.categoria==="aplicacao_cdb"||l.categoria==="Aplicação CDB")&&l.tipo==="despesa";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var cdbRes=lancamentos.filter(function(l){return(l.categoria==="aplicacao_cdb"||l.categoria==="Aplicação CDB")&&l.tipo==="receita";}).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var cdb=cdbInicial+cdbApl-cdbRes;

  var cxDispEnt=contasReceber.filter(function(x){return x.status==="Recebido";}).reduce(function(a,x){return a+Number(x.valor||0);},0);
  cxDispEnt+=cdbRes;
  var cxDispSaiLanc=lancamentos.filter(function(l){
    return l.tipo==="despesa"&&l.categoria!=="aplicacao_cdb_desp"&&l.categoria!=="aplicacao_cdb"&&l.categoria!=="Aplicação CDB";
  }).reduce(function(a,l){return a+Number(l.valor||0);},0);
  var cxDispSaiPag=contasPagar.filter(function(x){return x.status==="Pago";}).reduce(function(a,x){return a+Number(x.valor||0);},0);
  var cxDisp=cxDispEnt-cxDispSaiLanc-cxDispSaiPag;

  // Entradas por categoria
  var entCats={};

  h+=row("Total Entradas",cxEnt,"dre-total");

  h+=row("SAÍDAS",undefined,"dre-group");
  // Saídas por categoria — mesma lógica do DRE: comissões separadas + demais categorias
  if(comissoes>0)h+=row("Comissão",-comissoes,"dre-sub",1);
  Object.keys(despCats).forEach(function(label){
    var tot=despCats[label].reduce(function(a,x){return a+x.valor;},0);
    h+=row(label,-tot,"dre-sub",1);
  });
  h+=row("Total Saídas",-cxSai,"dre-total");
  h+=row("= Saldo do Período",saldoPeriodo,saldoPeriodo>=0?"dre-total":"dre-neg");

  h+='<div style="margin-top:10px;padding:10px 14px;background:rgba(16,163,127,.08);border:1px solid rgba(16,163,127,.2);border-radius:8px;display:flex;justify-content:space-between"><span style="color:var(--text2);font-size:13px">💵 Caixa Disponível</span><strong style="color:var(--green)">'+fmtCur(cxDisp)+'</strong></div>';

  h+='</div></div></div></div>';

function exportarDRE(){
  var rows=[["Descrição","Valor"]];
  document.querySelectorAll(".dre-row").forEach(function(el){
    var cols=el.querySelectorAll("span");

    else if(cols.length===1)rows.push([cols[0].textContent.trim(),""]);
  });
  // CSV com ponto-e-vírgula (compatível com Excel/WPS Brasil)
  var csv=rows.map(function(r){return r.map(function(c){return c.replace(/;/g,",");}).join(";");}).join("\r\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="dre_autohub.csv";a.click();URL.revokeObjectURL(url);
  notify("CSV exportado!");
}

  h+='<div class="sc" style="border:2px solid var(--yellow-border)"><div class="sc-header" style="background:var(--yellow-bg)"><span class="sc-title" style="color:var(--yellow)">🔄 Migração de Dados (Sistema Antigo)</span></div><div style="padding:16px">';

function addCanal(){
  showModal("Adicionar Canal",'<div class="fg"><div class="fi full"><label class="fl">Nome do Canal *</label><input id="canal_nome" placeholder="Ex: OLX, iCarros..."></div><div class="fi full"><label class="fl">Taxa Padrão (R$)</label><input id="canal_taxa" placeholder="0,00"></div></div>',function(){
    var nome=(gv("canal_nome")||"").trim(),taxa=getMV("canal_taxa");
    if(!nome){notify("Digite o nome","err");return;}
    if(!cfg.canais)cfg.canais=[];
    cfg.canais.push({nome:nome,taxa:taxa});salvarCfg().then(function(){notify("Adicionado!");closeModal();});
  });moedaInput("canal_taxa");
}
function editCanal(idx){
  var c=getCanais()[idx];if(!c)return;
  showModal("Editar Canal",'<div class="fg"><div class="fi full"><label class="fl">Nome</label><input id="canal_nome" value="'+escH(c.nome)+'"></div><div class="fi full"><label class="fl">Taxa (R$)</label><input id="canal_taxa" value="'+Number(c.taxa||0).toLocaleString("pt-BR",{minimumFractionDigits:2})+'"></div></div>',function(){
    var nome=(gv("canal_nome")||"").trim(),taxa=getMV("canal_taxa");
    if(!nome){notify("Digite o nome","err");return;}
    if(!cfg.canais)cfg.canais=[];
    cfg.canais[idx]={nome:nome,taxa:taxa};salvarCfg().then(function(){notify("Atualizado!");closeModal();});
  });moedaInput("canal_taxa");
}
function delCanal(idx){confirmDlg("Remover Canal","Tem certeza?",function(){if(!cfg.canais)return;cfg.canais.splice(idx,1);salvarCfg().then(function(){notify("Removido");});});}

function addCategoria(){
  showModal("Nova Categoria",'<div class="fg"><div class="fi full"><label class="fl">Nome da Categoria *</label><input id="cat_nome" placeholder="Ex: Frete, Seguros..."></div><div class="fi full"><label class="fl">Tipo *</label><select id="cat_tipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></div></div>',function(){
    var nome=(gv("cat_nome")||"").trim();
    if(!nome){notify("Digite o nome","err");return;}
    var tipo=gv("cat_tipo")||"despesa";
    var key="custom_"+nome.toLowerCase().replace(/[^a-z0-9]/g,"_").replace(/_+/g,"_").slice(0,40)+"_"+Date.now().toString(36);
    // Verificar duplicata
    var allCats=getCats();
    if(allCats.find(function(c){return c.label.toLowerCase()===nome.toLowerCase();})){notify("Categoria já existe","err");return;}
    if(!cfg.categorias)cfg.categorias=[];
    cfg.categorias.push({key:key,label:nome,tipo:tipo});
    salvarCfg().then(function(){notify("Categoria adicionada!");closeModal();}).catch(function(e){notify("Erro","err");});
  });
}
function delCategoria(idx){
  confirmDlg("Remover Categoria","Remover categoria personalizada? Lançamentos existentes não serão afetados.",function(){
    if(!cfg.categorias)return;
    cfg.categorias.splice(idx,1);
    salvarCfg().then(function(){notify("Removida");});
  });
}
function cfgAdd(campo,label){
  showModal("Adicionar "+label,'<div class="fi"><label class="fl">'+label+'</label><input id="cfg_nome" placeholder="Digite o nome..."></div>',function(){
    var nome=(gv("cfg_nome")||"").trim();if(!nome){notify("Digite o nome","err");return;}
    if(!cfg[campo])cfg[campo]=[];
    if(cfg[campo].indexOf(nome)>=0){notify("Já cadastrado","err");return;}
    cfg[campo].push(nome);salvarCfg().then(function(){notify("Adicionado!");closeModal();}).catch(function(e){notify("Erro","err");});
  });
}
function cfgDel(campo,idx,def){
  confirmDlg("Remover","Tem certeza?",function(){
    if(!cfg[campo])cfg[campo]=def?def.slice():[];
    cfg[campo].splice(idx,1);salvarCfg().then(function(){notify("Removido");});
  });
}
function fazerBackup(){
  var data={exportadoEm:new Date().toISOString(),vendas:vendas,lancamentos:lancamentos,contasReceber:contasReceber,contasPagar:contasPagar,posvenda:posvenda,config:cfg};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="backup_autohub_"+today()+".json";a.click();URL.revokeObjectURL(url);
  notify("Backup exportado!");
}

// ══ LEADS ══
var leadFiltroStatus="";
var leadFiltroTipo="";
var leadBusca="";
var leadFiltroMes="";

function setLeadFiltro(key,val){
  if(key==="status")leadFiltroStatus=val;
  if(key==="tipo")leadFiltroTipo=val;
  if(key==="busca")leadBusca=val;
  if(key==="mes")leadFiltroMes=val;
  render();
}

function atualizarStatusLead(id,novoStatus){
  db.collection("leads").doc(id).update({status:novoStatus}).then(function(){notify("Status atualizado!");}).catch(function(e){notify("Erro","err");});
}

function converterLeadCliente(id){
  var l=leads.find(function(x){return x.id===id;});
  if(!l)return;
  // Verificar se já existe cliente com mesmo WhatsApp
  var tel=(l.whatsapp||"").replace(/\D/g,"");
  var existe=clientes.find(function(c){return (c.telefone||"").replace(/\D/g,"")===tel&&tel;});
  if(existe){notify("Cliente já cadastrado: "+escH(existe.nome||""),"err");return;}
  var data={
    nome:l.nome||"",
    telefone:l.whatsapp||"",
    cidade:l.cidade||"",
    tipo:l.tipo||"",
    origem:"lead-site",
    leadId:id,
    dataCriacao:today()
  };
  col("clientes").add(data).then(function(){
    col("leads").doc(id).update({status:"Aprovado",convertidoCliente:true}).catch(function(){});
    notify("✅ "+escH(l.nome||"")+" convertido em cliente!");
    playSound("pagamento");
  }).catch(function(e){notify("Erro: "+e.message,"err");});
}

function exportarLeadsExcel(){
  var lista=leadFiltroMes?leads.filter(function(l){return(l.createdAt||"").slice(0,7)===leadFiltroMes;}):leads;
  if(!lista.length){notify("Nenhum lead para exportar","err");return;}
  var header=["Data/Hora","Nome","WhatsApp","Cidade","Tipo de Negócio","Volume Mensal","Status"];
  var rows=lista.map(function(l){
    return [l.dataHora||fmtDate(l.createdAt||""),l.nome||"",l.whatsapp||"",l.cidade||"",l.tipo||"",l.volume||"",l.status||"Novo"];
  });
  var dados=[header].concat(rows);
  var nome="Leads_TH"+(leadFiltroMes?"_"+leadFiltroMes:"")+"_"+today();
  exportarExcel(dados,nome,"Leads");
}

function relatorioLeads(){
  var todos=leads;
  if(!todos.length){notify("Nenhum lead para gerar relatório","err");return;}

  // ── Aba 1: Todos os leads ──
  var ab1=[["Data/Hora","Nome","WhatsApp","Cidade","Tipo de Negócio","Volume Mensal","Status"]];
  todos.forEach(function(l){
    ab1.push([l.dataHora||fmtDate(l.createdAt||""),l.nome||"",l.whatsapp||"",l.cidade||"",l.tipo||"",l.volume||"",l.status||"Novo"]);
  });

  // ── Aba 2: Por mês ──
  var meses={};
  todos.forEach(function(l){
    var m=(l.createdAt||"").slice(0,7);if(!m)return;
    if(!meses[m])meses[m]={total:0,novos:0,contatados:0,aprovados:0,recusados:0,lojistas:0,autonomos:0};
    meses[m].total++;
    var st=l.status||"Novo";
    if(st==="Novo")meses[m].novos++;
    else if(st==="Contatado")meses[m].contatados++;
    else if(st==="Aprovado")meses[m].aprovados++;
    else if(st==="Recusado")meses[m].recusados++;
    if((l.tipo||"").indexOf("CNPJ")>=0)meses[m].lojistas++;
    else meses[m].autonomos++;
  });
  var nomes=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  var ab2=[["Mês","Total","Novos","Contatados","Aprovados","Recusados","Lojistas CNPJ","Autônomos","Taxa Conversão %"]];
  Object.keys(meses).sort().reverse().forEach(function(m){
    var d=meses[m];
    var p=m.split("-");
    var taxa=d.total>0?Number(((d.aprovados/d.total)*100).toFixed(1)):0;
    ab2.push([(nomes[parseInt(p[1])-1]||p[1])+"/"+p[0],d.total,d.novos,d.contatados,d.aprovados,d.recusados,d.lojistas,d.autonomos,taxa]);
  });

  // ── Aba 3: Ranking cidades ──
  var cidades={};
  todos.forEach(function(l){var c=(l.cidade||"Não informado").trim();cidades[c]=(cidades[c]||0)+1;});
  var totalGeral=todos.length;
  var ab3=[["#","Cidade","Qtd Leads","% do Total"]];
  Object.keys(cidades).map(function(c){return{cidade:c,total:cidades[c]};}).sort(function(a,b){return b.total-a.total;}).forEach(function(c,i){
    var pct=totalGeral>0?Number(((c.total/totalGeral)*100).toFixed(1)):0;
    ab3.push([i+1,c.cidade,c.total,pct]);
  });

  // ── Gerar Excel com 3 abas ──
  var wb=XLSX.utils.book_new();
  [["Leads",ab1],["Por Mês",ab2],["Ranking Cidades",ab3]].forEach(function(p){
    var ws=XLSX.utils.aoa_to_sheet(p[1]);
    // Largura automática das colunas
    var cols=[];
    p[1][0].forEach(function(_,i){var max=12;p[1].forEach(function(r){var v=String(r[i]||"");if(v.length>max)max=v.length;});cols.push({wch:Math.min(max+2,40)});});
    ws["!cols"]=cols;
    XLSX.utils.book_append_sheet(wb,ws,p[0]);
  });
  XLSX.writeFile(wb,"Relatorio_Leads_TH_"+today()+".xlsx");
  notify("Relatório Excel gerado com "+todos.length+" leads!");
}

function excluirLead(id){
  confirmDlg("Excluir Lead","Tem certeza?",function(){
    db.collection("leads").doc(id).delete().then(function(){notify("Lead excluído");}).catch(function(e){notify("Erro","err");});
  });
}

function renderLeads(){
  // Métricas — baseadas no mês filtrado (ou tudo se sem filtro)
  var leadsMes=leadFiltroMes?leads.filter(function(l){return(l.createdAt||"").slice(0,7)===leadFiltroMes;}):leads;
  var total=leadsMes.length;
  var novos=leadsMes.filter(function(l){return l.status==="Novo";}).length;
  var contatados=leadsMes.filter(function(l){return l.status==="Contatado";}).length;
  var aprovados=leadsMes.filter(function(l){return l.status==="Aprovado";}).length;
  var lojistas=leadsMes.filter(function(l){return (l.tipo||"").indexOf("CNPJ")>=0||(l.tipo||"").indexOf("Lojista")>=0;}).length;
  var autonomos=leadsMes.filter(function(l){return (l.tipo||"").indexOf("autônomo")>=0||(l.tipo||"").indexOf("autonomo")>=0;}).length;

  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">';
  h+='<div><h2 style="font-size:18px;font-weight:700;margin:0">🌐 Leads do Site</h2>';
  h+='<p style="font-size:13px;color:var(--text2);margin:4px 0 0">Pessoas que se cadastraram pelo site para entrar na comunidade</p></div>';
  h+='<div style="display:flex;gap:8px">';
  h+='<button class="btn btn-g" onclick="exportarLeadsExcel()" style="font-size:12px">📥 Exportar Excel</button>';
  h+='<button class="btn btn-s" onclick="relatorioLeads()" style="font-size:12px">📊 Relatório</button>';
  h+='</div></div>';
  // Cards
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px">';
  var cards=[
    {label:"Total de Leads",val:total,cor:"var(--blue)"},
    {label:"🆕 Novos",val:novos,cor:"var(--yellow)"},
    {label:"📞 Contatados",val:contatados,cor:"var(--blue)"},
    {label:"✅ Aprovados",val:aprovados,cor:"var(--green)"},
    {label:"🏪 Lojistas",val:lojistas,cor:"var(--purple)"},
    {label:"🙋 Autônomos",val:autonomos,cor:"var(--orange)"},
  ];
  cards.forEach(function(c){
    h+='<div class="mc" style="border-left:3px solid '+c.cor+'">';
    h+='<div style="font-size:22px;font-weight:800;color:'+c.cor+'">'+c.val+'</div>';
    h+='<div class="mc-label">'+c.label+'</div>';
    h+='</div>';
  });
  h+='</div>';

  // Montar lista de meses disponíveis nos leads
  var mesesLeads=[];
  leads.forEach(function(l){var m=(l.createdAt||"").slice(0,7);if(m&&mesesLeads.indexOf(m)<0)mesesLeads.push(m);});
  mesesLeads.sort().reverse();
  if(!leadFiltroMes&&mesesLeads.length)leadFiltroMes=mesesLeads[0];
  function fmtMesLead(m){if(!m)return m;var p=m.split("-");var n=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];return(n[parseInt(p[1])-1]||p[1])+"/"+p[0];}

  // Filtros
  h+='<div class="sc" style="margin-bottom:16px"><div style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">';
  // Seletor de mês
  h+='<select onchange="setLeadFiltro(\'mes\',this.value)" style="padding:7px 12px;border:1px solid var(--blue);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--white);font-weight:600;color:var(--blue)">';
  h+='<option value="">📅 Todos os meses</option>';
  mesesLeads.forEach(function(m){h+='<option value="'+m+'"'+(leadFiltroMes===m?" selected":"")+">"+fmtMesLead(m)+"</option>";});
  h+='</select>';
  h+='<div style="position:relative;flex:1;min-width:200px"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px">🔍</span>';
  h+='<input type="text" placeholder="Buscar nome, cidade, WhatsApp..." value="'+escH(leadBusca)+'" oninput="setLeadFiltro(\'busca\',this.value)" style="padding:7px 12px 7px 32px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--bg);color:var(--text);width:100%"></div>';
  h+='<select onchange="setLeadFiltro(\'status\',this.value)" style="padding:7px 12px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--white)">';
  h+='<option value="">Todos os status</option>';
  ["Novo","Contatado","Aprovado","Recusado"].forEach(function(s){h+='<option value="'+s+'"'+(leadFiltroStatus===s?" selected":"")+">"+s+"</option>";});
  h+='</select>';
  h+='<select onchange="setLeadFiltro(\'tipo\',this.value)" style="padding:7px 12px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--white)">';
  h+='<option value="">Todos os tipos</option>';
  h+='<option value="CNPJ"'+(leadFiltroTipo==="CNPJ"?" selected":"")+">🏪 Lojista com CNPJ</option>";
  h+='<option value="autonomo"'+(leadFiltroTipo==="autonomo"?" selected":"")+">🙋 Autônomo</option>";
  h+='</select>';
  if(leadFiltroStatus||leadFiltroTipo||leadBusca||leadFiltroMes)h+='<button class="btn btn-s" style="font-size:12px" onclick="leadFiltroStatus=\'\';leadFiltroTipo=\'\';leadBusca=\'\';leadFiltroMes=\'\';render()">✕ Limpar</button>';
  h+='</div></div>';

  // Filtrar leads
  var filtrados=leads.filter(function(l){
    var bOk=!leadBusca||((l.nome||"")+(l.whatsapp||"")+(l.cidade||"")).toLowerCase().indexOf(leadBusca.toLowerCase())>=0;
    var sOk=!leadFiltroStatus||(l.status||"Novo")===leadFiltroStatus;
    var tOk=!leadFiltroTipo||(l.tipo||"").toLowerCase().indexOf(leadFiltroTipo.toLowerCase())>=0;
    var mOk=!leadFiltroMes||(l.createdAt||"").slice(0,7)===leadFiltroMes;
    return bOk&&sOk&&tOk&&mOk;
  });

  if(!filtrados.length){
    h+='<div class="sc"><div class="empty" style="padding:50px">🌐<br><br>'+(leads.length?"Nenhum lead com esses filtros.":"Nenhum lead ainda. Assim que alguém preencher o formulário do site, vai aparecer aqui automaticamente.")+'</div></div>';
    return h;
  }

  // Tabela
  h+='<div class="sc"><div style="overflow-x:auto"><table><thead><tr>';
  h+='<th>Data/Hora</th><th>Nome</th><th>WhatsApp</th><th>Cidade</th><th>Tipo</th><th>Volume/mês</th><th>Status</th><th>Ações</th>';
  h+='</tr></thead><tbody>';

  var statusCores={Novo:"var(--yellow)",Contatado:"var(--blue)",Aprovado:"var(--green)",Recusado:"var(--red)"};

  filtrados.forEach(function(l){
    var st=l.status||"Novo";
    var cor=statusCores[st]||"var(--text2)";
    var tel=(l.whatsapp||"").replace(/\D/g,"");
    h+='<tr>';
    h+='<td style="font-size:11px;color:var(--text2);white-space:nowrap">'+(l.dataHora||fmtDate(l.createdAt||""))+'</td>';
    h+='<td style="font-weight:600">'+(l.nome||"-")+'</td>';
    h+='<td>'+(tel?'<a href="https://wa.me/55'+tel+'" target="_blank" style="color:var(--green);font-weight:600;text-decoration:none">📱 '+escH(l.whatsapp||"")+'</a>':"-")+'</td>';
    h+='<td style="font-size:12px">'+(l.cidade||"-")+'</td>';
    h+='<td><span style="font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px 8px">'+(l.tipo||"-")+'</span></td>';
    h+='<td style="font-size:12px">'+(l.volume||"-")+'</td>';
    h+='<td><select onchange="atualizarStatusLead(\''+l.id+'\',this.value)" style="padding:3px 8px;border:1px solid var(--border);border-radius:99px;font-size:11px;font-weight:600;color:'+cor+';background:var(--white);font-family:inherit;cursor:pointer">';
    ["Novo","Contatado","Aprovado","Recusado"].forEach(function(s){
      h+='<option value="'+s+'"'+(st===s?" selected":"")+">"+s+"</option>";
    });
    h+='</select></td>';
    h+='<td><div style="display:flex;gap:6px;flex-wrap:wrap">';
    if(tel)h+='<a href="https://wa.me/55'+tel+'" target="_blank"><button class="btn btn-g" style="font-size:11px;padding:4px 8px">💬</button></a>';
    h+='<button class="btn btn-p" style="font-size:11px;padding:4px 8px" onclick="converterLeadCliente(\''+l.id+'\')" title="Converter em Cliente">👤+</button>';
    h+='<button class="btn btn-d" style="font-size:11px;padding:4px 8px" onclick="excluirLead(\''+l.id+'\')">🗑</button>';
    h+='</div></td>';
    h+='</tr>';
  });

  h+='</tbody></table></div></div>';
  return h;
}
