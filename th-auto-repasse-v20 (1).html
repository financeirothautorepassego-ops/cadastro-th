var FIPE_BASE='https://parallelum.com.br/fipe/api/v1/';

function initFipe(){
  fipeCarregarMarcas();
}

async function fipeFetch(url){
  try{
    var r=await fetch(url);
    if(!r.ok)return null;
    return await r.json();
  }catch(e){return null;}
}

async function fipeCarregarMarcas(){
  var tipo=document.getElementById('fTipo');if(!tipo)return;
  var sel=document.getElementById('fMarca');
  sel.disabled=true;sel.innerHTML='<option>Carregando...</option>';
  document.getElementById('fModelo').disabled=true;document.getElementById('fModelo').innerHTML='<option>— selecione a marca —</option>';
  document.getElementById('fAno').disabled=true;document.getElementById('fAno').innerHTML='<option>— selecione o modelo —</option>';
  document.getElementById('fBtnConsultar').disabled=true;
  var data=await fipeFetch(FIPE_BASE+tipo.value+'/marcas');
  if(data&&data.length){
    sel.innerHTML='<option value="">— selecione —</option>'+data.map(function(m){return'<option value="'+m.codigo+'">'+escH(m.nome)+'</option>';}).join('');
    sel.disabled=false;
  }else{sel.innerHTML='<option>Erro ao carregar</option>';}
}

async function fipeCarregarModelos(){
  var tipo=document.getElementById('fTipo').value;
  var marca=document.getElementById('fMarca').value;
  if(!marca)return;
  var sel=document.getElementById('fModelo');
  sel.disabled=true;sel.innerHTML='<option>Carregando...</option>';
  document.getElementById('fAno').disabled=true;document.getElementById('fAno').innerHTML='<option>— selecione o modelo —</option>';
  document.getElementById('fBtnConsultar').disabled=true;
  var data=await fipeFetch(FIPE_BASE+tipo+'/marcas/'+marca+'/modelos');
  var list=(data&&data.modelos)||[];
  if(list.length){
    sel.innerHTML='<option value="">— selecione —</option>'+list.map(function(m){return'<option value="'+m.codigo+'">'+escH(m.nome)+'</option>';}).join('');
    sel.disabled=false;
  }else{sel.innerHTML='<option>Erro ao carregar</option>';}
}

async function fipeCarregarAnos(){
  var tipo=document.getElementById('fTipo').value;
  var marca=document.getElementById('fMarca').value;
  var modelo=document.getElementById('fModelo').value;
  if(!modelo)return;
  var sel=document.getElementById('fAno');
  sel.disabled=true;sel.innerHTML='<option>Carregando...</option>';
  document.getElementById('fBtnConsultar').disabled=true;
  var data=await fipeFetch(FIPE_BASE+tipo+'/marcas/'+marca+'/modelos/'+modelo+'/anos');
  if(data&&data.length){
    sel.innerHTML=data.map(function(a){return'<option value="'+a.codigo+'">'+escH(a.nome)+'</option>';}).join('');
    sel.disabled=false;
    document.getElementById('fBtnConsultar').disabled=false;
  }else{sel.innerHTML='<option>Erro ao carregar</option>';}
}

async function fipeConsultar(){
  var tipo=document.getElementById('fTipo').value;
  var marca=document.getElementById('fMarca').value;
  var modelo=document.getElementById('fModelo').value;
  var ano=document.getElementById('fAno').value;
  if(!marca||!modelo||!ano)return;
  var btn=document.getElementById('fBtnConsultar');
  var sp=document.getElementById('fipeSpinner');
  btn.disabled=true;sp.style.display='inline';
  document.getElementById('fipeResultado').style.display='none';
  var data=await fipeFetch(FIPE_BASE+tipo+'/marcas/'+marca+'/modelos/'+modelo+'/anos/'+ano);
  btn.disabled=false;sp.style.display='none';
  if(!data||!data.Valor){notify('Erro ao consultar FIPE','err');return;}
  document.getElementById('fipeResultado').style.display='block';
  var cards=document.getElementById('fipeCards');
  function mc(label,val,cor){return'<div class="mc"><div class="mc-label">'+label+'</div><div class="mc-value" style="font-size:17px;color:'+(cor||'var(--text)')+'">'+escH(val||'—')+'</div></div>';}
  cards.innerHTML=
    mc('💰 Valor FIPE',data.Valor,'var(--green)')+
    mc('Marca',data.Marca)+
    mc('Modelo',data.Modelo)+
    mc('Ano Modelo',String(data.AnoModelo))+
    mc('Combustível',data.Combustivel)+
    mc('Código FIPE',data.CodigoFipe)+
    mc('Referência',data.MesReferencia,'var(--blue)');
}

// ══ METAS ══
function getMesAtual(){return today().slice(0,7);}
function fmtMes(m){if(!m)return"-";var p=m.split("-");var nomes=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];return(nomes[parseInt(p[1])-1]||p[1])+"/"+p[0];}

function abrirModalMeta(id){
  var mt=id?(metas.find(function(x){return x.id===id;})||{}):{}; 
  var mes=mt.mes||getMesAtual();
  var h='<div class="fg">';
  h+='<div class="fi"><label class="fl">Mês de referência *</label><input type="month" id="mt_mes" value="'+mes+'"></div>';
  h+='<div class="fi"><label class="fl">🚗 Qtd de veículos a vender</label><input type="number" id="mt_qtd" min="0" value="'+(mt.qtdVendas||"")+'" placeholder="Ex: 20"></div>';
  h+='<div class="fi"><label class="fl">💰 Receita total (R$)</label><input id="mt_receita" value="'+(mt.receita?Number(mt.receita).toLocaleString("pt-BR",{minimumFractionDigits:2}):"")+'" placeholder="0,00"></div>';
  h+='<div class="fi"><label class="fl">🎯 Ticket médio por venda (R$)</label><input id="mt_ticket" value="'+(mt.ticketMedio?Number(mt.ticketMedio).toLocaleString("pt-BR",{minimumFractionDigits:2}):"")+'" placeholder="0,00"></div>';
  h+='<div class="fi"><label class="fl">📈 Lucro líquido desejado (R$)</label><input id="mt_lucro" value="'+(mt.lucro?Number(mt.lucro).toLocaleString("pt-BR",{minimumFractionDigits:2}):"")+'" placeholder="0,00"></div>';
  h+='<div class="fi"><label class="fl">👤 Novos clientes</label><input type="number" id="mt_clientes" min="0" value="'+(mt.novosClientes||"")+'" placeholder="Ex: 10"></div>';
  h+='</div>';
  showModal((id?"Editar Meta":"Definir Meta"),h,function(){salvarMeta(id);});
  ["mt_receita","mt_ticket","mt_lucro"].forEach(function(f){moedaInput(f);});
}

function parseMoeda(v){return parseFloat((v||"0").replace(/\./g,"").replace(",","."))||0;}

function salvarMeta(id){
  var mes=document.getElementById("mt_mes").value;
  if(!mes){notify("Informe o mês","err");return;}
  // verificar se já existe meta para esse mês (exceto edição)
  var exist=metas.find(function(x){return x.mes===mes&&x.id!==id;});
  if(exist){notify("Já existe meta para "+fmtMes(mes),"err");return;}
  var data={
    mes:mes,
    qtdVendas:parseInt(document.getElementById("mt_qtd").value)||0,
    receita:parseMoeda(document.getElementById("mt_receita").value),
    ticketMedio:parseMoeda(document.getElementById("mt_ticket").value),
    lucro:parseMoeda(document.getElementById("mt_lucro").value),
    novosClientes:parseInt(document.getElementById("mt_clientes").value)||0,
    atualizadoEm:today()
  };
  if(id){col("metas").doc(id).update(data).then(function(){notify("Meta atualizada!");closeModal();}).catch(function(e){notify("Erro","err");});}
  else{col("metas").add(data).then(function(){notify("Meta definida!");closeModal();}).catch(function(e){notify("Erro","err");});}
}

function excluirMeta(id){confirmDlg("Excluir Meta","Tem certeza que deseja excluir esta meta?",function(){col("metas").doc(id).delete().then(function(){notify("Meta excluída");}).catch(function(e){notify("Erro","err");});});}

function calcReaisVendas(mes){
  return vendas.filter(function(v){
    return v.statusVenda!=="Cancelada"&&(v.dataVenda||v.dataCriacao||"").slice(0,7)===mes;
  });
}
function calcReaisReceita(mes){
  // Mesma lógica do DRE: contas a receber Recebidas no período
  return contasReceber.filter(function(x){
    return x.status==="Recebido"&&(x.dataRecebimento||x.vencimento||"").slice(0,7)===mes;
  }).reduce(function(a,x){return a+Number(x.valor||0);},0);
}

function barraProgresso(real,meta,label,icone,fmt){
  if(!meta||meta<=0)return"";
  var pct=Math.min(100,Math.round((real/meta)*100));
  var cor=pct>=100?"var(--green)":pct>=70?"var(--yellow)":"var(--red)";
  var emoji=pct>=100?"✅":pct>=70?"⚠️":"🔴";
  var vlReal=fmt==="num"?real:fmtCur(real);
  var vlMeta=fmt==="num"?meta:fmtCur(meta);
  return '<div style="margin-bottom:18px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
    +'<span style="font-size:13px;font-weight:600;color:var(--text)">'+icone+' '+label+'</span>'
    +'<span style="font-size:12px;color:var(--text2)">'+vlReal+' de '+vlMeta+' <strong style="color:'+cor+'">'+emoji+' '+pct+'%</strong></span>'
    +'</div>'
    +'<div style="background:var(--border);border-radius:99px;height:10px;overflow:hidden">'
    +'<div style="width:'+pct+'%;height:100%;background:'+cor+';border-radius:99px;transition:width .6s ease"></div>'
    +'</div></div>';
}

var metaFiltroMes="";
function setMetaFiltro(v){metaFiltroMes=v;render();}

function renderMetas(){
  var mesAtual=getMesAtual();
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h+='<div><h2 style="font-size:18px;font-weight:700;margin:0">🎯 Metas</h2><p style="font-size:13px;color:var(--text2);margin:4px 0 0">Defina e acompanhe seus objetivos mensais</p></div>';
  h+='<button class="btn btn-p" onclick="abrirModalMeta()">+ Definir Meta</button></div>';

  if(!metas.length){
    h+='<div class="sc"><div class="empty" style="padding:60px">🎯<br><br>Nenhuma meta definida ainda.<br><span style="font-size:12px">Clique em <strong>Definir Meta</strong> para começar.</span></div></div>';
    return h;
  }

  // Filtro por mês
  h+='<div class="sc" style="margin-bottom:16px"><div style="padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
  h+='<span style="font-size:13px;font-weight:600;color:var(--text2)">📅 Filtrar mês:</span>';
  h+='<select onchange="setMetaFiltro(this.value)" style="padding:6px 12px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--white)">';
  h+='<option value="">Todos os meses</option>';
  metas.forEach(function(mt){
    h+='<option value="'+mt.mes+'"'+(metaFiltroMes===mt.mes?' selected':'')+'>'+fmtMes(mt.mes)+'</option>';
  });
  h+='</select>';
  if(metaFiltroMes)h+='<button class="btn btn-s" style="font-size:12px" onclick="setMetaFiltro(\'\')">✕ Limpar</button>';
  h+='</div></div>';

  var metasFiltradas=metaFiltroMes?metas.filter(function(mt){return mt.mes===metaFiltroMes;}):metas;

  if(!metasFiltradas.length){
    h+='<div class="sc"><div class="empty">Nenhuma meta encontrada para este mês.</div></div>';
    return h;
  }

  metasFiltradas.forEach(function(mt){
    var mes=mt.mes||"";
    var vendasMes=calcReaisVendas(mes);
    var qtdReal=vendasMes.length;
    var receitaReal=calcReaisReceita(mes);
    // Lucro = receita - lançamentos de despesa - todo A Pagar pago (igual ao DRE)
    var despMes=lancamentos.filter(function(l){return l.tipo==="despesa"&&(l.data||"").slice(0,7)===mes;}).reduce(function(a,l){return a+Number(l.valor||0);},0);
    var cpMesTodos=contasPagar.filter(function(x){return x.status==="Pago"&&(x.dataPagamento||x.vencimento||"").slice(0,7)===mes;}).reduce(function(a,x){return a+Number(x.valor||0);},0);
    var lucroReal=receitaReal-despMes-cpMesTodos;
    // Ticket médio líquido = saldo do período ÷ qtd veículos
    var ticketReal=qtdReal>0?lucroReal/qtdReal:0;
    // clientes novos no mês
    // Novos compradores únicos no mês (baseado nas vendas)
    var clientesMes=[...new Set(vendasMes.map(function(v){return v.nomeComprador||"";}))].filter(function(n){return n;}).length;
    var isAtual=mes===mesAtual;
    var todasMetas=[mt.qtdVendas,mt.receita,mt.ticketMedio,mt.lucro,mt.novosClientes].every(function(x){return !x||x<=0;});

    h+='<div class="sc" style="margin-bottom:20px">';
    h+='<div class="sc-header">';
    h+='<div style="display:flex;align-items:center;gap:10px">';
    h+='<span style="font-size:20px">📅</span>';
    h+='<div><div style="font-size:15px;font-weight:700">'+fmtMes(mes)+'</div>';
    if(isAtual)h+='<span style="font-size:11px;background:var(--blue-light);color:var(--blue);padding:2px 8px;border-radius:99px;font-weight:600">Mês atual</span>';
    h+='</div></div>';
    h+='<div style="display:flex;gap:8px">';
    h+='<button class="btn btn-s" style="font-size:12px" onclick="abrirModalMeta(\''+mt.id+'\')">✏️ Editar</button>';
    h+='<button class="btn btn-d" style="font-size:12px" onclick="excluirMeta(\''+mt.id+'\')">🗑</button>';
    h+='</div></div>';
    h+='<div style="padding:20px">';

    if(todasMetas){
      h+='<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Nenhum objetivo definido para este mês. Clique em ✏️ Editar para adicionar.</div>';
    } else {
      // Cards resumo topo
      h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px">';
      if(mt.qtdVendas>0){var p1=Math.min(100,Math.round(qtdReal/mt.qtdVendas*100));h+='<div class="mc" style="text-align:center"><div style="font-size:22px;font-weight:800;color:'+(p1>=100?"var(--green)":p1>=70?"var(--yellow)":"var(--red)")+'">'+qtdReal+'/'+mt.qtdVendas+'</div><div class="mc-label">🚗 Veículos</div></div>';}
      if(mt.receita>0){var p2=Math.min(100,Math.round(receitaReal/mt.receita*100));h+='<div class="mc" style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+(p2>=100?"var(--green)":p2>=70?"var(--yellow)":"var(--red)")+'">'+p2+'%</div><div class="mc-label">💰 Receita</div></div>';}
      if(mt.ticketMedio>0){var p3=Math.min(100,Math.round(ticketReal/mt.ticketMedio*100));h+='<div class="mc" style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+(p3>=100?"var(--green)":p3>=70?"var(--yellow)":"var(--red)")+'">'+p3+'%</div><div class="mc-label">🎯 Ticket Médio</div></div>';}
      if(mt.lucro>0){var p4=Math.min(100,Math.round(lucroReal/mt.lucro*100));h+='<div class="mc" style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+(p4>=100?"var(--green)":p4>=70?"var(--yellow)":"var(--red)")+'">'+p4+'%</div><div class="mc-label">📈 Lucro</div></div>';}
      if(mt.novosClientes>0){var p5=Math.min(100,Math.round(clientesMes/mt.novosClientes*100));h+='<div class="mc" style="text-align:center"><div style="font-size:22px;font-weight:800;color:'+(p5>=100?"var(--green)":p5>=70?"var(--yellow)":"var(--red)")+'">'+clientesMes+'/'+mt.novosClientes+'</div><div class="mc-label">👤 Clientes</div></div>';}
      h+='</div>';
      // Barras de progresso
      if(mt.qtdVendas>0)h+=barraProgresso(qtdReal,mt.qtdVendas,"Veículos vendidos","🚗","num");
      if(mt.receita>0)h+=barraProgresso(receitaReal,mt.receita,"Receita total","💰","cur");
      if(mt.ticketMedio>0)h+=barraProgresso(ticketReal,mt.ticketMedio,"Ticket médio por venda","🎯","cur");
      if(mt.lucro>0)h+=barraProgresso(lucroReal,mt.lucro,"Lucro líquido","📈","cur");
      if(mt.novosClientes>0)h+=barraProgresso(clientesMes,mt.novosClientes,"Novos clientes","👤","num");
    }
    h+='</div></div>';
  });
  return h;
}


// ══ USUÁRIOS ══
function renderUsuarios(){
  var isAdmin=usuarioLogado==="admin";
  var h='<div class="sc"><div class="sc-header"><span class="sc-title">Minha Conta</span></div><div style="padding:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-s" data-action="trocar-senha-me">🔒 Alterar Senha</button><button class="btn btn-d" onclick="fazerLogout()">Sair</button></div></div>';

function novoUsuario(){
  showModal("Adicionar Usuário",'<div class="fg"><div class="fi"><label class="fl">Usuário</label><input id="nu_u" placeholder="Ex: operador1"></div><div class="fi"><label class="fl">Senha</label><input type="password" id="nu_p"></div><div class="fi full"><label class="fl">Confirmar Senha</label><input type="password" id="nu_p2"></div></div>',function(){
    var u=(gv("nu_u")||"").trim().toLowerCase(),p=gv("nu_p"),p2=gv("nu_p2");
    if(!u||u.length<3){notify("Mín. 3 caracteres","err");return;}if(USUARIOS[u]){notify("Já existe","err");return;}
    if(p.length<6){notify("Senha mín. 6 caracteres","err");return;}if(p!==p2){notify("Senhas não conferem","err");return;}
    hashSenha(p).then(function(h){USUARIOS[u]=h;salvarUsuarios();notify("Criado!");closeModal();render();});
  });

function trocarSenha(user){
  var isMe=user===usuarioLogado;
  showModal("Alterar Senha",'<div class="fg">'+(isMe?'<div class="fi full"><label class="fl">Senha Atual</label><input type="password" id="ap_a"></div>':'')+'<div class="fi full"><label class="fl">Nova Senha</label><input type="password" id="ap_n"></div><div class="fi full"><label class="fl">Confirmar</label><input type="password" id="ap_c"></div></div>',function(){
    var n=gv("ap_n");if(n.length<6){notify("Mín. 6 caracteres","err");return;}if(n!==gv("ap_c")){notify("Não conferem","err");return;}
    if(isMe){
      hashSenha(gv("ap_a")).then(function(ha){
        if(ha!==USUARIOS[user]){notify("Senha atual incorreta","err");return;}
        hashSenha(n).then(function(hn){USUARIOS[user]=hn;salvarUsuarios();notify("Senha alterada!");closeModal();});
      });
    } else {
      hashSenha(n).then(function(hn){USUARIOS[user]=hn;salvarUsuarios();notify("Senha alterada!");closeModal();});
    }
  });
}
function permUser(user){

function delUser(user){

function showModal(title,body,saveFn,type){

  m.innerHTML='<div class="mh"><span class="mt">'+title+'</span><button class="mc2" onclick="closeModal()">×</button></div><div class="mb">'+body+'</div>'+footer;

}

    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows2),"Lancamentos");
  }
  var crP=contasReceber.filter(function(x){return(x.placa||"").toUpperCase()===placa;});
  if(crP.length){
    var rows3=[["Descricao","Valor","Vencimento","Status"]].concat(crP.map(function(x){return[x.descricao||"",Number(x.valor||0).toFixed(2),fmtDate(x.vencimento),x.status||""];}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows3),"A Receber");
  }
  var cpP=contasPagar.filter(function(x){return(x.placa||"").toUpperCase()===placa;});
  if(cpP.length){
    var rows4=[["Descricao","Categoria","Parceiro","Valor","Vencimento","Status"]].concat(cpP.map(function(x){return[x.descricao||"",catLabel(x.categoria||"outros"),(x.parceiro||x.comissario)||"",Number(x.valor||0).toFixed(2),fmtDate(x.vencimento),x.status||""];}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows4),"A Pagar");
  }
  XLSX.writeFile(wb,"dossie_"+placa+".xlsx");
  notify("Excel do Dossie exportado!");
}

  }
  if(lancsP.length){h2+='<div class="sec-title">Lancamentos</div><table><thead><tr><th>Data</th><th>Tipo</th><th>Descricao</th><th>Categoria</th><th>Valor</th></tr></thead><tbody>';lancsP.forEach(function(l){var rec=catTipo(l.categoria)==="receita";h2+='<tr><td>'+fmtDate(l.data)+'</td><td>'+(rec?"Receita":"Despesa")+'</td><td>'+escH(l.descricao||"-")+'</td><td>'+catLabel(l.categoria)+'</td><td class="'+(rec?"green":"red")+'">'+fmtCur(l.valor)+'</td></tr>';});h2+='</tbody></table>';}
  if(crP.length){h2+='<div class="sec-title">A Receber</div><table><thead><tr><th>Descricao</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>';crP.forEach(function(x){h2+='<tr><td>'+escH(x.descricao||"-")+'</td><td class="green">'+fmtCur(x.valor)+'</td><td>'+fmtDate(x.vencimento)+'</td><td>'+escH(x.status||"Pendente")+'</td></tr>';});h2+='</tbody></table>';}
  if(cpP.length){h2+='<div class="sec-title">A Pagar</div><table><thead><tr><th>Descricao</th><th>Categoria</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>';cpP.forEach(function(x){h2+='<tr><td>'+escH(x.descricao||"-")+'</td><td>'+catLabel(x.categoria||"outros")+'</td><td class="red">'+fmtCur(x.valor)+'</td><td>'+fmtDate(x.vencimento)+'</td><td>'+escH(x.status||"Pendente")+'</td></tr>';});h2+='</tbody></table>';}
  if(!h2)h2='<p style="color:#6B7280">Nenhum registro para '+escH(placa)+'</p>';

function migLog(msg,cor){
  var el=document.getElementById("mig_log");
  if(!el)return;
  el.style.display="block";
  var d=document.createElement("div");
  d.style.color=cor||"var(--text2)";
  d.style.borderBottom="1px solid var(--border)";
  d.style.padding="2px 0";
  d.textContent=msg;
  el.appendChild(d);
  el.scrollTop=el.scrollHeight;
}

function parseCsvMig(text){
  text=text.replace(/^\uFEFF/,"");
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  function parseLinha(line){
    var cols=[],cur="",inQ=false;
    for(var i=0;i<line.length;i++){
      var c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if(c===","&&!inQ){cols.push(cur);cur="";}
      else{cur+=c;}
    }
    cols.push(cur);
    return cols;
  }
  var headers=parseLinha(lines[0]).map(function(h){return h.trim();});
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var cols=parseLinha(lines[i]);
    if(!cols.join("").trim())continue;
    var obj={};
    headers.forEach(function(h,idx){obj[h]=(cols[idx]||"").trim();});
    rows.push(obj);
  }
  return rows;
}

function lerArqMig(file){
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(e){res(parseCsvMig(e.target.result));};
    r.readAsText(file,"UTF-8");
  });
}

function numMig(v){return Number((v||"0").toString().replace(/[^0-9.,]/g,"").replace(",","."))||0;}

function fmtDataMig(d){
  if(!d||d==="-")return today();
  d=d.trim();
  var m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m)return(m[3].length===2?"20"+m[3]:m[3])+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  if(d.match(/^\d{4}-\d{2}-\d{2}/))return d.slice(0,10);
  return today();
}

function pipStageMig(s){
  var m={"Carro Liberado":"Liberado","Aguard. Liberacao":"Aguardando Liberação","Aguard. Boleto":"Aguardando Boleto","Boleto Pago":"Boleto Pago","Boleto Enviado":"Boleto Enviado","Cancelada":"Cancelada"};
  return m[s]||"Aguardando Boleto";
}

function mapCatMig(cat){
  var m={"venda":"intermediacao","compra veiculo":"compra_de_carros","comissao":"comissao","comissão":"comissao","despesa":"despesa_operacional","custo fixo":"fixo","retirada de socio":"outros","transferencia":"outros","aplicacao cdb":"aplicacao_cdb","imposto":"imposto","contabilidade":"contabilidade","documentacao":"documentacao","documentação":"documentacao","marketing":"marketing","outros":"outros","":"outros"};
  return m[(cat||"").toLowerCase().trim()]||"outros";
}

async function limparMigracao(){
  var log=document.getElementById("mig_log");
  if(log){log.innerHTML="";log.style.display="block";}
  migLog("🗑 Limpando dados migrados...","var(--yellow)");
  var colecoes=["vendas","clientes","lancamentos","contasPagar","contasReceber"];
  for(var i=0;i<colecoes.length;i++){
    var snap=await col(colecoes[i]).get();
    var total=snap.docs.length;
    for(var j=0;j<snap.docs.length;j++) await snap.docs[j].ref.delete();
    migLog("🗑 "+colecoes[i]+": "+total+" registros removidos","var(--red)");
  }
  // Limpar config de parceiros
  try{await col("config").doc("main").delete();}catch(e){}
  migLog("✅ Limpeza concluída! Pode migrar agora.","var(--green)");
}

async function migrarDados(){
  var fVendas=document.getElementById("mig_vendas").files[0];
  var fFin=document.getElementById("mig_fin").files[0];
  var fCli=document.getElementById("mig_cli").files[0];
  var fParc=document.getElementById("mig_parc").files[0];

  if(!fCli){
    notify("Selecione pelo menos o CSV de Clientes!","err");
    return;
  }

  var log=document.getElementById("mig_log");
  if(log){log.innerHTML="";log.style.display="block";}

  migLog("🗑 Limpando dados anteriores...","var(--yellow)");
  await limparMigracao();

  migLog("📂 Lendo arquivos CSV...","var(--blue)");
  var vendas=fVendas?await lerArqMig(fVendas):[];
  var financeiro=fFin?await lerArqMig(fFin):[];
  var clientes=await lerArqMig(fCli);
  var parceiros=fParc?await lerArqMig(fParc):[];
  migLog("✅ "+vendas.length+" vendas | "+financeiro.length+" lançamentos | "+clientes.length+" clientes","var(--green)");

  // ── 1. CLIENTES ──
  migLog("👥 Migrando clientes...","var(--blue)");
  var clienteMap={};
  for(var i=0;i<clientes.length;i++){
    var c=clientes[i];
    var nome=(c["Nome"]||"").trim();
    if(!nome)continue;
    var ref=await col("clientes").add({
      nome:nome,telefone:c["Telefone"]||"",email:c["Email"]||"",
      cpfCnpj:c["CPF"]||c["CNPJ"]||"",cidade:c["Cidade"]||"",
      uf:c["Estado"]||"",obs:c["Obs"]||"",dataCriacao:today()
    });
    clienteMap[nome]=ref.id;
  }
  migLog("✅ "+Object.keys(clienteMap).length+" clientes migrados","var(--green)");

  // ── 2. PARCEIROS ──
  if(parceiros.length){
    var pNomes=parceiros.map(function(p){return(p["Nome"]||"").trim();}).filter(Boolean);
    await col("config").doc("main").set({parceiros:pNomes},{merge:true});
    migLog("✅ Parceiros: "+pNomes.join(", "),"var(--green)");
  }

  // ── 3. VENDAS ──
  migLog("🚗 Migrando vendas...","var(--blue)");
  for(var j=0;j<vendas.length;j++){
    var v=vendas[j];
    var placa=(v["Placa"]||"").toUpperCase().trim();
    var modelo=(v["Veiculo"]||"").trim();
    if(!placa&&!modelo)continue;
    var pipeline=pipStageMig(v["Status"]);
    var sVenda=v["Status"]==="Carro Liberado"?"Concluída":v["Status"]==="Cancelada"?"Cancelada":"Em Andamento";
    var nomeCliente=(v["Cliente"]||"").trim();
    await col("vendas").add({
      placa:placa,modelo:modelo,dataVenda:fmtDataMig(v["Data Venda"]),
      valorCusto:numMig(v["Custo"]),valorVenda:numMig(v["Valor Venda"]),
      statusVenda:sVenda,pipelineStage:pipeline,
      clienteId:clienteMap[nomeCliente]||null,
      nomeComprador:nomeCliente,nomeLoja:"",uf:"",telefone:"",cpfCnpj:"",
      vendedor:"",fornecedor:"",obs:v["Obs"]||"",
      km:numMig(v["KM"])||0,ano:v["Ano"]||"",
      dataCriacao:today(),loja:"TH AUTO REPASSE"
    });
  }
  migLog("✅ "+vendas.length+" vendas migradas","var(--green)");

  // ── 4. FINANCEIRO ──
  migLog("💰 Migrando lançamentos...","var(--blue)");
  for(var k=0;k<financeiro.length;k++){
    var f=financeiro[k];
    if(!f["Valor"]||!f["Data"])continue;
    var catNova=mapCatMig(f["Categoria"]||"");
    await col("lancamentos").add({
      tipo:f["Tipo"]==="entrada"?"receita":"despesa",
      categoria:catNova,descricao:f["Descricao"]||"",
      valor:numMig(f["Valor"]),data:fmtDataMig(f["Data"]),
      placa:(f["Placa"]||"").toUpperCase(),
      parceiro:f["Parceiro"]||"",obs:f["Obs"]||"",dataCriacao:today()
    });
  }
  migLog("✅ "+financeiro.length+" lançamentos migrados","var(--green)");

  // ── 5. SALDO INICIAL CDB ──
  // Saldo real: R$ 138.799,58 — movimentos CDB no CSV: R$ 31.395,58 — inicial: R$ 107.404,00
  var saldoInicialCDB=107404.00;
  await col("lancamentos").add({
    tipo:"receita",categoria:"saldo_cdb",
    descricao:"Saldo CDB - Ajuste de Abertura",
    valor:saldoInicialCDB,data:"2026-01-01",
    placa:"",obs:"Saldo inicial migrado do sistema antigo",dataCriacao:today()
  });
  migLog("✅ Saldo inicial CDB: R$ "+saldoInicialCDB.toLocaleString("pt-BR",{minimumFractionDigits:2}),"var(--green)");

  migLog("🎉 MIGRAÇÃO CONCLUÍDA! Clique em recarregar abaixo.","var(--green)");
  notify("Migração concluída!");
  var log=document.getElementById("mig_log");
  if(log){
    var btn=document.createElement("button");
    btn.textContent="🔄 Recarregar Sistema Agora";
    btn.style="margin-top:8px;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:700;font-size:13px;width:100%";
    btn.onclick=function(){window.location.reload();};
    log.appendChild(btn);
  }
}

  var el=document.getElementById(id);if(!el)return;
  var vis=el.style.display!=="none";
